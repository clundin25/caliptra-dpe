name: Deploy Documentation & DPE Cert Visualizer to GitHub Pages

# Deploys the static site to GitHub Pages on pushes to `main`:
# - mdBook Documentation root: https://chipsalliance.github.io/caliptra-dpe/ (or ${{ steps.deployment.outputs.page_url }})
# - DPE Certificate Visualizer: https://chipsalliance.github.io/caliptra-dpe/cert-printer/ (or ${{ steps.deployment.outputs.page_url }}cert-printer/)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Nix
        run: |
          sudo apt-get update
          sudo apt-get install -y nix-bin
          sudo mkdir -p /nix
          sudo chown -R $(whoami) /nix
          mkdir -p ~/.config/nix
          echo "experimental-features = nix-command flakes" > ~/.config/nix/nix.conf

      - name: Build WASM App & JS Bindings
        run: |
          export NIX_REMOTE=local
          nix develop --command cargo xtask cert-graph

      - name: Build mdBook Documentation
        run: |
          # Builds mdBook documentation deployed to root URL: https://chipsalliance.github.io/caliptra-dpe/
          export NIX_REMOTE=local
          nix develop --command cargo xtask doc

      - name: Prepare Pages Directory
        run: |
          # Prepare static site directory for GitHub Pages deployment:
          # - Visualizer at /cert-printer/ (https://chipsalliance.github.io/caliptra-dpe/cert-printer/)
          # - mdBook documentation at root / (https://chipsalliance.github.io/caliptra-dpe/)
          mkdir -p dist/cert-printer
          cp tools/index.html dist/cert-printer/
          cp -r tools/pkg dist/cert-printer/
          cp -r docs/book/* dist/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

